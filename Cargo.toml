[package]
name = "NeuroDrive"
version = "0.1.0"
edition = "2024"

[features]
profiling = []

[lib]
name = "neurodrive"
path = "src/lib.rs"

[[bin]]
name = "NeuroDrive"
path = "src/main.rs"

[dependencies]
bevy = "0.18.0"
rand = "0.10.0"
rand_distr = "0.6.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
